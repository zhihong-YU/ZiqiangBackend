# Private preview: reached only through an SSH tunnel to 127.0.0.1:8080.
# Backend remains in production mode with secure cookies; localhost is trusted.
server {
    listen 127.0.0.1:8080;
    server_name localhost 127.0.0.1;
    root /opt/ZQfrontend/dist;
    index index.html;
    client_max_body_size 105M;

    location /static/ { alias /opt/ZQbackend/staticfiles/; }
    location /media/avatars/ {
        alias /opt/ZQbackend/media/avatars/;
        add_header X-Content-Type-Options nosniff;
    }
    location /media/ { return 404; }
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
    location /django-admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / { try_files $uri $uri/ /index.html; }
}
