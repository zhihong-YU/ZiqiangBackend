server {
    listen 80;
    server_name ziqiangkexie.cn www.ziqiangkexie.cn;
    access_log /www/wwwlogs/ziqiang-access.log;
    error_log /www/wwwlogs/ziqiang-error.log warn;

    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ziqiangkexie.cn www.ziqiangkexie.cn;
    access_log /www/wwwlogs/ziqiang-access.log;
    error_log /www/wwwlogs/ziqiang-error.log warn;
    ssl_certificate /etc/letsencrypt/live/ziqiangkexie.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ziqiangkexie.cn/privkey.pem;
    root /opt/ZQfrontend/dist;
    index index.html;
    client_max_body_size 105M;

    location /static/ {
        alias /opt/ZQbackend/staticfiles/;
    }

    # Only avatars are public. Private uploads require the authenticated API.
    location /media/avatars/ {
        alias /opt/ZQbackend/media/avatars/;
        add_header X-Content-Type-Options nosniff;
    }

    location /media/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # /admin is the React management console. Django admin has its own path.
    location /django-admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
