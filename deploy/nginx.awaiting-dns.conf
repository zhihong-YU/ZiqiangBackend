# Keep login endpoints private until DNS and the real certificate are ready.
server {
    listen 80;
    server_name ziqiangkexie.cn www.ziqiangkexie.cn 160.202.237.191;
    charset utf-8;
    access_log /www/wwwlogs/ziqiang-access.log;
    error_log /www/wwwlogs/ziqiang-error.log warn;
    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }
    location / {
        default_type text/plain;
        return 503 '自强科协平台正在完成上线配置，请稍后访问。';
    }
}
